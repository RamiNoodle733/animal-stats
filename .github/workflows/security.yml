name: Security and release guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sensitive-export-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject sensitive exports
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run security:exports
          range="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "push" \
            && -n "$BEFORE_SHA" \
            && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" \
            ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          elif [[ "$EVENT_NAME" == "pull_request" \
            && -n "$BASE_SHA" \
            && -n "$HEAD_SHA" \
            ]] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null; then
            range="$BASE_SHA..$HEAD_SHA"
          fi
          node scripts/security/check-sensitive-exports.js --rev-range "$range"

      - name: Lint JavaScript
        run: npm run lint

      - name: Run unit and contract tests
        run: npm test

      - name: Enforce route performance budgets
        run: npm run perf:budget

      - name: Verify release version agreement
        run: npm run version:check

      - name: Build allowlisted deployment artifact
        run: npm run build

  release-production:
    needs: sensitive-export-guard
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for matching Vercel production deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            payload="$(curl --fail --silent --show-error --max-time 10 "https://animalbattlestats.com/version.json?commit=$EXPECTED_COMMIT" || true)"
            deployed_commit="$(node -e "try { const value=JSON.parse(process.argv[1]); process.stdout.write(value.commit || '') } catch {}" "$payload")"
            if [[ "$deployed_commit" == "$EXPECTED_COMMIT" ]]; then
              echo "Production is serving $EXPECTED_COMMIT"
              exit 0
            fi
            sleep 10
          done
          echo "Production did not publish the expected commit within ten minutes."
          exit 1

      - name: Smoke test recovery API
        run: |
          curl --fail --silent --show-error --max-time 20 \
            'https://animalbattlestats.com/api/community?action=globe' \
            | node -e "let raw=''; process.stdin.on('data', c => raw += c); process.stdin.on('end', () => { const body=JSON.parse(raw); if (!body.success || body.schemaVersion !== 2 || !Array.isArray(body.data?.points)) process.exit(1); })"

      - name: Create version tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to overwrite it."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$tag" --message "Animal Battle Stats $tag"
          git push origin "$tag"
          gh release create "$tag" --verify-tag --generate-notes --title "Animal Battle Stats $tag"
